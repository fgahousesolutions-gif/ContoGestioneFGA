<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rendiconto Sandu Francesco</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #647181;
      --line: #d9e1e6;
      --bg: #f5f7f8;
      --panel: #fff;
      --green: #146c4f;
      --blue: #205f8f;
      --red: #b42318;
      --yellow: #996800;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 22px clamp(16px, 4vw, 42px);
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 40px); letter-spacing: 0; }
    p { margin: 0; color: var(--muted); line-height: 1.45; }
    main { padding: 20px clamp(16px, 4vw, 42px) 44px; }
    .upload {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input[type=file] {
      width: 100%;
      min-height: 54px;
      padding: 13px;
      border: 2px dashed var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 750;
    }
    input[type=file]::file-selector-button {
      border: 0;
      border-radius: 6px;
      margin-right: 12px;
      padding: 11px 16px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    .ghost { background: #e9eef2; color: var(--ink); }
    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .status {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border: 1px solid #b8ddcc;
      border-radius: 8px;
      background: #edf7f2;
      color: #185b43;
      font-weight: 850;
    }
    .status.active { display: block; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .tab {
      min-height: 58px;
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .view { display: none; }
    .view.active { display: block; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .dashboard-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
      align-items: start;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 360px) minmax(120px, 180px);
      gap: 12px;
      margin-bottom: 14px;
      padding: 16px;
      background: #f8fbfd;
      border: 1px solid #b9cedc;
      border-radius: 8px;
      box-shadow: 0 1px 0 rgba(23, 33, 43, .05);
    }
    .field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }
    select {
      width: 100%;
      min-height: 46px;
      padding: 9px 12px;
      border: 2px solid #9db8c9;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 850;
      cursor: pointer;
    }
    input[type=date] {
      width: 100%;
      min-height: 46px;
      padding: 9px 12px;
      border: 2px solid #9db8c9;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 850;
    }
    select:focus {
      outline: 3px solid rgba(32, 95, 143, .16);
      border-color: var(--blue);
    }
    .kpi, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .kpi { padding: 14px; min-height: 96px; }
    .kpi strong { display: block; font-size: clamp(22px, 3vw, 32px); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .kpi span { color: var(--muted); font-size: 13px; font-weight: 780; }
    .panel { margin-bottom: 18px; overflow: hidden; }
    .side-panel {
      position: sticky;
      top: 16px;
    }
    .period-card {
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    .period-card:last-child { border-bottom: 0; }
    .period-card h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }
    .date-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid #d7b75f;
      background: #fff5d6;
      color: #5d4300;
      font-size: 12px;
      font-weight: 900;
    }
    .period-grid {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 780;
    }
    .period-grid div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .period-grid strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .expense-groups {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }
    .summary-kpis {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .summary-kpis .kpi {
      margin: 0;
    }
    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .panel-head span { color: var(--muted); font-size: 13px; font-weight: 750; }
    .table-wrap { overflow: auto; }
    table { width: 100%; min-width: 860px; border-collapse: collapse; }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    th {
      background: #f9fbfc;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    td.money, th.money { text-align: right; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e9f2f7;
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
    }
    .pill.booking { background: #eef0ff; color: #3f4aa2; }
    .pill.airbnb { background: #fff0f0; color: #a63b3b; }
    .pill.dirette { background: #e8f6ef; color: var(--green); }
    .settlement {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .settlement .kpi { min-height: 122px; }
    .delta-box {
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 8px;
      border: 2px solid var(--line);
      background: #fff;
    }
    .delta-box > span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 900;
    }
    .delta-box strong {
      display: block;
      margin-top: 6px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .quick-card {
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 126px;
    }
    .quick-card h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .quick-card strong {
      display: block;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }
    .quick-card p {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 760;
    }
    .settlement-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .settlement-list {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }
    .settlement-list div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-weight: 800;
    }
    .settlement-list strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .personal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .personal-detail {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .personal-detail h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .forecast-controls {
      display: grid;
      grid-template-columns: minmax(180px, 260px) minmax(180px, 260px);
      gap: 12px;
      padding: 14px 16px;
      background: #f8fbfd;
      border-bottom: 1px solid var(--line);
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 12px;
    }
    .section-title h2 { font-size: 22px; }
    .compact-table table { min-width: 720px; }
    .positive strong { color: var(--green); }
    .negative strong { color: var(--red); }
    .warnings {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid #ead28f;
      border-radius: 8px;
      background: #fff8e5;
      color: #6f4b00;
      font-weight: 760;
    }
    .warnings.active { display: block; }
    .empty {
      padding: 28px;
      color: var(--muted);
      font-weight: 760;
    }
    @media (max-width: 920px) {
      header, .upload { grid-template-columns: 1fr; }
      .tabs, .kpis, .settlement { grid-template-columns: 1fr; }
      .settlement-grid, .summary-kpis, .personal-grid, .personal-detail, .forecast-controls, .quick-grid { grid-template-columns: 1fr; }
      .dashboard-layout { grid-template-columns: 1fr; }
      .side-panel { position: static; }
      header button, .upload button { width: 100%; }
      .header-actions { justify-content: stretch; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Rendiconto Sandu Francesco</h1>
      <p>Appartamenti ID003, ID004, ID005 e ID006 con utile, spese condivise e dare/avere.</p>
    </div>
    <div class="header-actions">
      <button class="ghost" id="exportCsvBtn" type="button" disabled>Scarica CSV</button>
      <button class="ghost" id="refreshBtn" type="button">Aggiorna</button>
    </div>
  </header>

  <main>
    <form class="upload" id="uploadForm">
      <input id="fileInput" type="file" accept=".xlsx">
      <button id="uploadBtn" type="submit">Carica Excel</button>
    </form>

    <div class="status" id="statusBox"></div>
    <div class="warnings" id="warningsBox"></div>

    <nav class="tabs">
      <button class="tab active" data-view="dashboard" type="button">Rendimento</button>
      <button class="tab" data-view="expenses" type="button">Spese</button>
      <button class="tab" data-view="settlement" type="button">Rendiconto</button>
    </nav>

    <section class="view active" id="dashboard"></section>
    <section class="view" id="expenses"></section>
    <section class="view" id="settlement"></section>
  </main>

  <script>
    const euro = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: "always" });
    const integerFmt = new Intl.NumberFormat("it-IT", { maximumFractionDigits: 0, useGrouping: "always" });
    const dateTime = new Intl.DateTimeFormat("it-IT", { dateStyle: "medium", timeStyle: "short" });
    let state = null;
    let selectedApartment = "all";
    let selectedYear = String(new Date().getFullYear());
    let forecastDate = "";

    const $ = (id) => document.getElementById(id);
    const fmt = (value) => euro.format(Number(value || 0));
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[ch]));
    const channelClass = (value) => String(value || "").toLowerCase().replace(/[^a-z]/g, "") || "other";

    function uploadedLabel(value) {
      if (!value) return "Nessun file caricato";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return dateTime.format(date);
    }

    function sum(rows, key) {
      return rows.reduce((total, row) => total + Number(row[key] || 0), 0);
    }

    function parseDate(value) {
      if (!value) return null;
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function isoDay(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }

    function endOfMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0);
    }

    function dateLabel(value) {
      const date = parseDate(value);
      return date ? new Intl.DateTimeFormat("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }).format(date) : "";
    }

    function apartmentOptions() {
      const apartments = state?.apartments || [];
      return [`<option value="all">Tutti gli appartamenti</option>`].concat(apartments.map((apt) => `
        <option value="${esc(apt.id)}" ${selectedApartment === apt.id ? "selected" : ""}>${esc(apt.label || apt.id)}</option>
      `)).join("");
    }

    function availableYears() {
      const years = new Set();
      (state?.bookings || []).forEach((row) => {
        const checkIn = parseDate(row.checkIn);
        if (checkIn) years.add(checkIn.getFullYear());
      });
      (state?.expenses?.groups || []).forEach((group) => {
        if (group.year) years.add(Number(group.year));
      });
      (state?.settlement?.years || []).forEach((year) => {
        if (year.year) years.add(Number(year.year));
      });
      (state?.settlement?.projection?.years || []).forEach((year) => {
        if (year.year) years.add(Number(year.year));
      });
      years.add(new Date().getFullYear());
      return [...years].sort((a, b) => b - a);
    }

    function yearOptions() {
      const years = availableYears();
      if (!years.includes(Number(selectedYear))) {
        selectedYear = String(years[0] || new Date().getFullYear());
      }
      return years.map((year) => `
        <option value="${year}" ${String(year) === selectedYear ? "selected" : ""}>${year}</option>
      `).join("");
    }

    function filteredBookings() {
      const rows = state?.bookings || [];
      return rows.filter((row) => {
        const checkIn = parseDate(row.checkIn);
        if (!checkIn || String(checkIn.getFullYear()) !== selectedYear) return false;
        if (selectedApartment === "all") return true;
        return row.sheet === selectedApartment;
      });
    }

    function apartmentFilteredBookings() {
      const rows = state?.bookings || [];
      if (selectedApartment === "all") return rows;
      return rows.filter((row) => row.sheet === selectedApartment);
    }

    function aggregateByChannel(bookings) {
      return bookings.reduce((acc, row) => {
        const bucket = acc[row.channel] ||= { gross: 0, netOwner: 0, cleaning: 0, francesco: 0, sandu: 0, sanduDueByFrancesco: 0, count: 0 };
        bucket.count += 1;
        ["gross", "netOwner", "cleaning", "francesco", "sandu", "sanduDueByFrancesco"].forEach((key) => {
          bucket[key] += Number(row[key] || 0);
        });
        return acc;
      }, {});
    }

    function periodRows(bookings, year) {
      const now = new Date();
      const currentYear = now.getFullYear();
      const selected = Number(year);
      const previousYear = selected - 1;
      const progressiveEnd = selected === currentYear
          ? new Date(selected, now.getMonth(), 0)
          : selected < currentYear
            ? new Date(selected, 11, 31)
          : new Date(selected, 0, 0);
      const futureStart = new Date(progressiveEnd);
      futureStart.setDate(futureStart.getDate() + 1);
      const byPeriod = { previous: [], progressive: [], future: [] };
      bookings.forEach((row) => {
        const checkIn = parseDate(row.checkIn);
        if (!checkIn) return;
        if (checkIn.getFullYear() === previousYear) byPeriod.previous.push(row);
        if (checkIn.getFullYear() === selected && checkIn <= progressiveEnd) byPeriod.progressive.push(row);
        if (checkIn.getFullYear() === selected && checkIn >= futureStart) byPeriod.future.push(row);
      });
      return { byPeriod, currentYear: selected, previousYear, progressiveEnd, futureStart };
    }

    function periodCard(title, subtitle, rows) {
      return `
        <div class="period-card">
          <h3>${esc(title)}</h3>
          <span class="date-badge">${esc(subtitle)}</span>
          <div class="period-grid">
            <div><span>Prenotazioni</span><strong>${integerFmt.format(rows.length)}</strong></div>
            <div><span>Lordo</span><strong>${fmt(sum(rows, "gross"))}</strong></div>
            <div><span>Netto proprieta</span><strong>${fmt(sum(rows, "netOwner"))}</strong></div>
            <div><span>Quota Sandu</span><strong>${fmt(sum(rows, "sandu"))}</strong></div>
            <div><span>Da girare</span><strong>${fmt(sum(rows, "sanduDueByFrancesco"))}</strong></div>
          </div>
        </div>
      `;
    }

    function renderPeriodBox(bookings, year) {
      const periods = periodRows(bookings, year);
      const endLabel = new Intl.DateTimeFormat("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }).format(periods.progressiveEnd);
      const startLabel = new Intl.DateTimeFormat("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }).format(periods.futureStart);
      return `
        <aside class="panel side-panel">
          <div class="panel-head"><h2>Periodi</h2><span>Check-in</span></div>
          ${periodCard(`Anno precedente ${periods.previousYear}`, "Totale anno", periods.byPeriod.previous)}
          ${periodCard(`Progressivo ${periods.currentYear}`, `Fino al ${endLabel}`, periods.byPeriod.progressive)}
          ${periodCard("Futuro", `Dal ${startLabel}`, periods.byPeriod.future)}
        </aside>
      `;
    }

    function renderStatus() {
      const box = $("statusBox");
      const exportBtn = $("exportCsvBtn");
      if (!state) {
        box.classList.remove("active");
        box.textContent = "";
        if (exportBtn) exportBtn.disabled = true;
        return;
      }
      box.classList.add("active");
      box.textContent = `Ultimo aggiornamento: ${uploadedLabel(state.uploadedAt)} - File: ${state.filename || ""}`;
      if (exportBtn) exportBtn.disabled = false;

      const warnings = $("warningsBox");
      if (state.warnings && state.warnings.length) {
        warnings.classList.add("active");
        warnings.innerHTML = state.warnings.map(esc).join("<br>");
      } else {
        warnings.classList.remove("active");
        warnings.textContent = "";
      }
    }

    function renderKpis(bookings) {
      return `
        <div class="kpis">
          <div class="kpi"><strong>${fmt(sum(bookings, "gross"))}</strong><span>Incasso lordo</span></div>
          <div class="kpi"><strong>${fmt(sum(bookings, "netOwner"))}</strong><span>Netto proprieta dopo pulizie</span></div>
          <div class="kpi"><strong>${fmt(sum(bookings, "francesco"))}</strong><span>Quota Francesco</span></div>
          <div class="kpi"><strong>${fmt(sum(bookings, "sandu"))}</strong><span>Quota Sandu maturata</span></div>
        </div>
      `;
    }

    function channelRows(channels) {
      return Object.entries(channels || {}).sort(([a], [b]) => a.localeCompare(b)).map(([name, row]) => `
        <tr>
          <td><span class="pill ${channelClass(name)}">${esc(name)}</span></td>
          <td>${integerFmt.format(row.count || 0)}</td>
          <td class="money">${fmt(row.gross)}</td>
          <td class="money">${fmt(row.cleaning)}</td>
          <td class="money">${fmt(row.netOwner)}</td>
          <td class="money">${fmt(row.francesco)}</td>
          <td class="money">${fmt(row.sandu)}</td>
          <td class="money">${fmt(row.sanduDueByFrancesco)}</td>
        </tr>
      `).join("");
    }

    function bookingRows(bookings) {
      return bookings.map((row) => `
        <tr>
          <td>${esc(row.apartmentLabel || row.sheet)}</td>
          <td>${esc(row.checkIn)}</td>
          <td>${esc(row.checkOut)}</td>
          <td><span class="pill ${channelClass(row.channel)}">${esc(row.channel)}</span></td>
          <td class="money">${fmt(row.gross)}</td>
          <td class="money">${fmt(row.cleaning)}</td>
          <td class="money">${fmt(row.netOwner)}</td>
          <td class="money">${fmt(row.francesco)}</td>
          <td class="money">${fmt(row.sandu)}</td>
          <td class="money">${fmt(row.sanduDueByFrancesco)}</td>
        </tr>
      `).join("");
    }

    function renderDashboard() {
      const bookings = filteredBookings();
      const periodSource = apartmentFilteredBookings();
      const channels = aggregateByChannel(bookings);

    function latestPayment(side) {
      const payments = (state?.settlement?.payments || []).filter((payment) => !side || payment.side === side);
      return payments.sort((a, b) => {
        const dateA = parseDate(a.date)?.getTime() || 0;
        const dateB = parseDate(b.date)?.getTime() || 0;
        if (dateA !== dateB) return dateB - dateA;
        return Number(b.row || 0) - Number(a.row || 0);
      })[0] || null;
    }

    function paymentPeriod(payment, fallbackLabel) {
      const text = `${payment?.note || ""} ${payment?.label || ""}`;
      const matchIt = text.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})/);
      if (matchIt) return `${matchIt[1].padStart(2, "0")}/${matchIt[2].padStart(2, "0")}/${matchIt[3]}`;
      const matchIso = text.match(/(20\d{2})-(\d{2})-(\d{2})/);
      if (matchIso) return `${matchIso[3]}/${matchIso[2]}/${matchIso[1]}`;
      return fallbackLabel || "";
    }

    function nextStopIso() {

    function aggregateBookingsBetween(startExclusive, endInclusive) {
      const start = startExclusive ? parseDate(startExclusive) : null;
      const end = endInclusive ? parseDate(endInclusive) : null;
      const rows = [];
      (state?.bookings || []).forEach((booking) => {
        const checkIn = parseDate(booking.checkIn);
        if (!checkIn) return;
        if (start && checkIn <= start) return;
        if (end && checkIn > end) return;
        rows.push(booking);
      });
      const byApartment = {};
      rows.forEach((booking) => {
        const key = booking.apartmentLabel || booking.sheet || "Appartamento";
        const item = byApartment[key] ||= { apartment: key, count: 0, gross: 0, netOwner: 0, francesco: 0, sandu: 0, sanduDueByFrancesco: 0 };
        item.count += 1;
        ["gross", "netOwner", "francesco", "sandu", "sanduDueByFrancesco"].forEach((field) => {
          item[field] += Number(booking[field] || 0);
        });
      });
      return Object.values(byApartment).sort((a, b) => a.apartment.localeCompare(b.apartment));
    }

    function aggregateRows(rows) {
      return rows.reduce((acc, row) => {
        acc.count += Number(row.count || 0);
        ["gross", "netOwner", "francesco", "sandu", "sanduDueByFrancesco"].forEach((field) => {
          acc[field] += Number(row[field] || 0);
        });
        return acc;
      }, { count: 0, gross: 0, netOwner: 0, francesco: 0, sandu: 0, sanduDueByFrancesco: 0 });
    }

    function csvCell(value) {
      const text = String(value ?? "").replace(/\r?\n/g, " ");
      return /[",;\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function csvNumber(value) {
      return Number(value || 0).toFixed(2).replace(".", ",");
    }

    function buildCsvRows() {
      const rows = [["Sezione", "Voce", "Periodo/Data", "Valore", "Francesco", "Sandu", "Francesco->Sandu", "Sandu->Francesco", "Note"]];
      if (!state) return rows;
      const s = state.settlement || {};
      rows.push(["File", state.filename || "", uploadedLabel(state.uploadedAt), "", "", "", "", "", ""]);
      rows.push(["Rendiconto", "Stop ufficiale", dateLabel(s.cutoffDate), "", "", "", "", "", ""]);
      rows.push(["Rendiconto", "Delta ufficiale", dateLabel(s.cutoffDate), csvNumber(Math.abs(s.overall?.delta)), "", "", csvNumber(s.overall?.francescoToSandu), csvNumber(s.overall?.sanduToFrancesco), Number(s.overall?.delta || 0) >= 0 ? "Francesco paga Sandu" : "Sandu paga Francesco"]);
      (s.payments || []).forEach((payment) => {
        rows.push(["Pagamenti", payment.label || "", dateLabel(payment.date), csvNumber(payment.amount), "", "", payment.side === "francesco_to_sandu" ? csvNumber(payment.amount) : "", payment.side === "sandu_to_francesco" ? csvNumber(payment.amount) : "", payment.note || ""]);
      });
      (s.years || []).forEach((year) => {
        rows.push(["Anno", String(year.year), "", csvNumber(Math.abs(year.delta)), "", "", csvNumber(year.francescoToSanduTotal), csvNumber(year.sanduToFrancescoTotal), year.delta >= 0 ? "Francesco paga Sandu" : "Sandu paga Francesco"]);
        Object.entries(year.francescoToSandu || {}).forEach(([name, value]) => rows.push(["Dettaglio anno", name, String(year.year), "", "", "", csvNumber(value), "", ""]));
        Object.entries(year.sanduToFrancesco || {}).forEach(([name, value]) => rows.push(["Dettaglio anno", name, String(year.year), "", "", "", "", csvNumber(value), ""]));
      });
      (s.personalProgress?.years || []).forEach((year) => {
        rows.push(["Progressivi personali", String(year.year), "", "", csvNumber(year.francescoTotal), csvNumber(year.sanduTotal), "", "", ""]);
      });
      aggregateBookingsBetween(null, s.cutoffDate).forEach((row) => {
        rows.push(["Prenotazioni aggregate", row.apartment, `Fino al ${dateLabel(s.cutoffDate)}`, csvNumber(row.gross), csvNumber(row.francesco), csvNumber(row.sandu), csvNumber(row.sanduDueByFrancesco), "", `${row.count} prenotazioni; netto proprieta ${csvNumber(row.netOwner)}`]);
      });
      aggregateBookingsBetween(s.cutoffDate, null).forEach((row) => {
        rows.push(["Prenotazioni future aggregate", row.apartment, `Dopo ${dateLabel(s.cutoffDate)}`, csvNumber(row.gross), csvNumber(row.francesco), csvNumber(row.sandu), csvNumber(row.sanduDueByFrancesco), "", `${row.count} prenotazioni; netto proprieta ${csvNumber(row.netOwner)}`]);
      });
      return rows;
    }

    function downloadCsv() {
      if (!state) return;
      const rows = buildCsvRows();
      const csv = rows.map((row) => row.map(csvCell).join(";")).join("\n");
      const blob = new Blob([`\uFEFF${csv}`], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `rendiconto-sandu-francesco-${stamp}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function addForecastSettlement(years, year, side, group, amount) {
      const key = String(year);
      const entry = years[key] ||= { year, francescoToSandu: {}, sanduToFrancesco: {}, francescoToSanduTotal: 0, sanduToFrancescoTotal: 0, delta: 0 };
      const mapKey = side === "francesco_to_sandu" ? "francescoToSandu" : "sanduToFrancesco";
      const totalKey = side === "francesco_to_sandu" ? "francescoToSanduTotal" : "sanduToFrancescoTotal";
      entry[mapKey][group] = (entry[mapKey][group] || 0) + Number(amount || 0);
      entry[totalKey] += Number(amount || 0);
    }

    function addForecastPersonal(years, year, person, group, amount) {
      const key = String(year);
      const entry = years[key] ||= { year, francesco: {}, sandu: {}, francescoTotal: 0, sanduTotal: 0 };
      const totalKey = person === "francesco" ? "francescoTotal" : "sanduTotal";
      entry[person][group] = (entry[person][group] || 0) + Number(amount || 0);
      entry[totalKey] += Number(amount || 0);
    }

    function finalizeForecastSettlement(years) {
      const overall = { francescoToSandu: 0, sanduToFrancesco: 0, delta: 0 };
      Object.values(years).forEach((entry) => {
        entry.delta = entry.francescoToSanduTotal - entry.sanduToFrancescoTotal;
        overall.francescoToSandu += entry.francescoToSanduTotal;
        overall.sanduToFrancesco += entry.sanduToFrancescoTotal;
      });
      overall.delta = overall.francescoToSandu - overall.sanduToFrancesco;
      return { overall, years: Object.values(years).sort((a, b) => b.year - a.year) };
    }

    function finalizeForecastPersonal(years) {
      const overall = { francesco: 0, sandu: 0 };
      Object.values(years).forEach((entry) => {
        overall.francesco += entry.francescoTotal;
        overall.sandu += entry.sanduTotal;
      });
      return { overall, years: Object.values(years).sort((a, b) => b.year - a.year) };
    }

    function includeAnnualItem(year, cutoff) {
      const itemYear = Number(year || 0);
      if (!itemYear) return false;
      return itemYear <= cutoff.getFullYear();
    }

    function includeDatedItem(item, cutoff) {
      const date = parseDate(item?.checkIn || item?.date);
      if (date) return date <= cutoff;
      return includeAnnualItem(item?.year, cutoff);
    }

    function forecastOptions() {
      const now = new Date();
      const options = [];
      for (let i = 0; i < 12; i += 1) {
        const date = endOfMonth(now.getFullYear(), now.getMonth() + i);
        options.push({ value: isoDay(date), label: `Fine ${new Intl.DateTimeFormat("it-IT", { month: "long", year: "numeric" }).format(date)}` });
      }
      const current = forecastDate || isoDay(endOfMonth(now.getFullYear(), now.getMonth()));
      if (!options.some((option) => option.value === current)) options.unshift({ value: current, label: `Data scelta ${dateLabel(current)}` });
      return options.map((option) => `<option value="${option.value}" ${option.value === current ? "selected" : ""}>${esc(option.label)}</option>`).join("");
    }

    function calculateForecast(dateValue) {
      const cutoff = parseDate(dateValue) || endOfMonth(new Date().getFullYear(), new Date().getMonth());
      const officialCutoff = parseDate(state?.settlement?.cutoffDate);
      const settlementYears = {};
      const personalYears = {};
      let futureSanduBookings = 0;
      (state?.bookings || []).forEach((booking) => {
        const checkIn = parseDate(booking.checkIn);
        if (!checkIn || checkIn > cutoff) return;
        if (officialCutoff && checkIn > officialCutoff) {
          futureSanduBookings += Number(booking.sanduDueByFrancesco || 0);
        }
        addForecastSettlement(settlementYears, checkIn.getFullYear(), "francesco_to_sandu", "Utili appartamenti", Number(booking.sanduDueByFrancesco || 0));
        addForecastPersonal(personalYears, checkIn.getFullYear(), "francesco", "Quote prenotazioni", Number(booking.francesco || 0));
        addForecastPersonal(personalYears, checkIn.getFullYear(), "sandu", "Quote prenotazioni", Number(booking.sandu || 0));
      });
      (state?.settlement?.dueToSanduBlocks || []).forEach((block) => {
        (block.items || []).forEach((item) => {
          if (includeDatedItem(item, cutoff)) addForecastSettlement(settlementYears, item.year, "francesco_to_sandu", item.category || "Sanremo", Number(item.amount || 0));
        });
      });
      (state?.expenses?.items || []).forEach((item) => {
        if (!includeAnnualItem(item.year, cutoff)) return;
        const group = String(item.category || "").trim().toLowerCase() === "varie" ? "Varie" : item.kind === "ADS" ? "ADS" : "Spese appartamenti";
        const share = Number(item.share || item.francescoShare || 0);
        addForecastSettlement(settlementYears, item.year, "sandu_to_francesco", group, share);
        addForecastPersonal(personalYears, item.year, "francesco", group, -share);
        addForecastPersonal(personalYears, item.year, "sandu", group, -share);
      });
      (state?.settlement?.dueToFrancescoBlocks || []).forEach((block) => {
        (block.items || []).forEach((item) => {
          if (includeDatedItem(item, cutoff)) addForecastSettlement(settlementYears, item.year, "sandu_to_francesco", "Tassa soggiorno Sanremo", Number(item.amount || 0));
        });
      });
      (state?.settlement?.payments || []).forEach((payment) => {
        if (includeDatedItem(payment, cutoff)) addForecastSettlement(settlementYears, payment.year, payment.side, "Pagamenti avvenuti", -Number(payment.amount || 0));
      });
      return {
        cutoff,
        settlement: finalizeForecastSettlement(settlementYears),
        personal: finalizeForecastPersonal(personalYears),
        futureSanduBookings,
      };
    }

    function renderForecastPanel() {
      const now = new Date();
      if (!forecastDate) forecastDate = isoDay(endOfMonth(now.getFullYear(), now.getMonth()));
      const forecast = calculateForecast(forecastDate);
      const net = Number(forecast.settlement.overall.delta || 0);
      const label = dateLabel(forecastDate);
      return `
        <div class="panel">
          <div class="panel-head">
            <h2>Previsione per periodo</h2>
            <span class="date-badge">Fino al ${esc(label)}</span>
          </div>
          <div class="forecast-controls">
            <label class="field">
              Fine mese
              <select id="forecastPreset">${forecastOptions()}</select>
            </label>
            <label class="field">
              Data libera
              <input id="forecastDateInput" type="date" value="${esc(forecastDate)}">
            </label>
          </div>
          <div class="settlement-grid">
            <div class="kpi positive"><strong>${fmt(forecast.personal.overall.francesco)}</strong><span>Francesco previsto</span></div>
            <div class="kpi positive"><strong>${fmt(forecast.personal.overall.sandu)}</strong><span>Sandu previsto</span></div>
          </div>
          <div class="settlement-grid">
            <div class="kpi"><strong>${fmt(forecast.futureSanduBookings)}</strong><span>Quote future Sandu da prenotazioni</span></div>
            <div class="kpi"><strong>${fmt(forecast.settlement.overall.delta)}</strong><span>Saldo netto previsto da inizio rapporto</span></div>
          </div>
          <div class="settlement-list">
            <div><span>Le quote future Sandu mostrano solo le prenotazioni dopo lo stop ufficiale; il saldo netto previsto compensa anche dare/avere e pagamenti gia presenti nel file.</span><strong></strong></div>
          </div>
          <div class="settlement">
            <div class="kpi positive"><strong>${fmt(forecast.settlement.overall.francescoToSandu)}</strong><span>Francesco deve a Sandu previsto</span></div>
            <div class="kpi negative"><strong>${fmt(forecast.settlement.overall.sanduToFrancesco)}</strong><span>Sandu deve a Francesco previsto</span></div>
          </div>
          <div class="delta-box ${net >= 0 ? "positive" : "negative"}">
            <span>Saldo netto previsto <span class="date-badge">Fino al ${esc(label)}</span></span>
            <strong>${fmt(Math.abs(net))}</strong>
            <p>${net >= 0 ? "Francesco dovrebbe pagare Sandu" : "Sandu dovrebbe pagare Francesco"}</p>
            <p>Il saldo netto previsto considera prenotazioni con check-in entro la data scelta, spese gia inserite, tasse/pulizie e pagamenti gia registrati nel file. Non include pagamenti futuri non ancora scritti.</p>
          </div>
        </div>
        ${forecast.personal.years.map(renderPersonalYear).join("")}
        ${forecast.settlement.years.map(renderYearSettlement).join("")}
      `;
    }

    function renderYearSettlement(year) {
      const delta = Number(year.delta || 0);
      return `
        <div class="panel">
          <div class="panel-head">
            <h2>${esc(year.year)}</h2>
            <span>${delta >= 0 ? "Francesco paga Sandu" : "Sandu paga Francesco"} ${fmt(Math.abs(delta))}</span>
          </div>
          <div class="settlement-grid">
            <div class="kpi positive"><strong>${fmt(year.francescoToSanduTotal)}</strong><span>Francesco deve a Sandu</span></div>
            <div class="kpi negative"><strong>${fmt(year.sanduToFrancescoTotal)}</strong><span>Sandu deve a Francesco</span></div>
          </div>
          <div class="settlement-list">
            <h2>Francesco -> Sandu</h2>
            ${settlementRows(year.francescoToSandu)}
          </div>
          <div class="settlement-list">
            <h2>Sandu -> Francesco</h2>
            ${settlementRows(year.sanduToFrancesco)}
          </div>
        </div>
      `;
    }

    function renderSettlement() {
      const s = state?.settlement || {};
      const overall = s.overall || {};
      const projection = s.projection || { overall: {}, years: [] };
      const net = Number(overall.delta || 0);
      const futureNet = Number(projection.overall?.delta || 0);
      const cutoffLabel = s.cutoffDate ? new Intl.DateTimeFormat("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(`${s.cutoffDate}T00:00:00`)) : "";
      $("settlement").innerHTML = !state ? `<div class="panel"><div class="empty">Carica il file Excel per calcolare il rendiconto.</div></div>` : `
        ${renderPaymentStatus(cutoffLabel, net)}
        ${renderNextStopSummary()}
        ${renderMovementPanels()}
        <div class="section-title"><h2>Saldo ufficiale</h2><span class="date-badge">Stop ${esc(cutoffLabel)}</span></div>
        <div class="delta-box ${net >= 0 ? "positive" : "negative"}">
          <span>Delta da saldare ${cutoffLabel ? `<span class="date-badge">Stop ${cutoffLabel}</span>` : ""}</span>
          <strong>${fmt(Math.abs(net))}</strong>
          <p>${net >= 0 ? "Francesco deve pagare Sandu" : "Sandu deve pagare Francesco"}</p>
        </div>
        <div class="settlement">
          <div class="kpi positive"><strong>${fmt(overall.francescoToSandu)}</strong><span>Totale Francesco deve a Sandu</span></div>
          <div class="kpi negative"><strong>${fmt(overall.sanduToFrancesco)}</strong><span>Totale Sandu deve a Francesco</span></div>
        </div>
        <div class="section-title"><h2>Progressivi e previsione</h2><span>Dettaglio sintetico</span></div>
        ${renderPersonalProgress(s.personalProgress || {}, cutoffLabel)}
        ${renderForecastPanel()}
        <div class="section-title"><h2>Dettagli rendiconto</h2><span>Per anno e voce</span></div>
        ${(s.years || []).map(renderYearSettlement).join("")}
        <div class="delta-box ${futureNet >= 0 ? "positive" : "negative"}">
          <span>Proiezione futura ${cutoffLabel ? `<span class="date-badge">Dopo ${cutoffLabel}</span>` : ""}</span>
          <strong>${fmt(Math.abs(futureNet))}</strong>
          <p>${projection.note || "Valori stimati su prenotazioni future."}</p>
        </div>
        ${(projection.years || []).map(renderYearSettlement).join("")}
      `;
      const preset = $("forecastPreset");
      const input = $("forecastDateInput");
      if (preset) {
        preset.addEventListener("change", () => {
          forecastDate = preset.value;
          renderSettlement();
        });
      }
      if (input) {
        input.addEventListener("change", () => {
          forecastDate = input.value;
          renderSettlement();
        });
      }
    }

    function renderAll() {
      renderStatus();
      renderDashboard();
      renderExpenses();
      renderSettlement();
    }

    async function loadCurrent() {
      try {
        const res = await fetch("/api/current");
        if (!res.ok) throw new Error("Backend non disponibile");
        const data = await res.json();
        state = data.state;
        renderAll();
      } catch (error) {
        state = null;
        renderAll();
        const box = $("warningsBox");
        box.classList.add("active");
        box.textContent = "Backend non disponibile: avvia server.py oppure pubblica la repo su un servizio Python. GitHub Pages da solo non puo salvare o leggere l'Excel.";
      }
    }

    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = "";
      const chunkSize = 0x8000;
      for (let index = 0; index < bytes.length; index += chunkSize) {
        binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
      }
      return btoa(binary);
    }

    async function uploadFile(file) {
      if (!file.name.toLowerCase().endsWith(".xlsx")) {
        throw new Error("Carica un file Excel .xlsx. Se e un vecchio .xls o viene da Numbers, esportalo prima come .xlsx.");
      }
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      if (!bytes.length) throw new Error("Il file caricato e vuoto.");
      if (bytes[0] !== 0x50 || bytes[1] !== 0x4b) {
        throw new Error("Il file non sembra un .xlsx valido. Aprilo con Excel/Numbers ed esportalo come Excel .xlsx.");
      }
      const contentBase64 = arrayBufferToBase64(buffer);
      const res = await fetch("/api/upload", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ filename: file.name, contentBase64 }),
      });
      let data = {};
      try {
        data = await res.json();
      } catch (error) {
        throw new Error("Backend non disponibile: questa pagina deve girare con server.py, non solo come sito statico GitHub.");
      }
      if (!res.ok) throw new Error(data.error || "Caricamento non riuscito");
      state = data;
      renderAll();
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab === button));
        document.querySelectorAll(".view").forEach((view) => view.classList.toggle("active", view.id === button.dataset.view));
      });
    });

    $("uploadForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = $("fileInput").files[0];
      if (!file) return;
      $("uploadBtn").disabled = true;
      $("uploadBtn").textContent = "Carico...";
      try {
        await uploadFile(file);
      } catch (error) {
        alert(error.message);
      } finally {
        $("uploadBtn").disabled = false;
        $("uploadBtn").textContent = "Carica Excel";
      }
    });

    $("refreshBtn").addEventListener("click", loadCurrent);
    $("exportCsvBtn").addEventListener("click", downloadCsv);
    loadCurrent();
  </script>
</body>
</html>
